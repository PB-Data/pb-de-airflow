# CONTOH. File di folder `config/examples/` TIDAK dibaca Airflow; tabel di
# bawah fiktif. Dipakai sebagai rujukan pola setelan. Untuk source sungguhan,
# buat file di `config/sources/` (lihat `dc_sby.yml`).
#
# Satu file = satu database source = satu DAG = satu schema.
#
# Kalau butuh schema lain (mis. `sales` selain `dbo`), buat file baru
# di folder ini. Jangan campur dua schema dalam satu file -- `sql_database`
# dari dlt hanya menerima satu schema per source.

source:
  name: erp_mssql               # jadi dag_id `bronze_ingest_erp_mssql`
  env_prefix: MSSQL             # baca MSSQL_HOST, MSSQL_PORT, MSSQL_USER, ...
  database: ERP                 # opsional; kalau kosong dibaca dari MSSQL_DATABASE
  schema: dbo
  bq_dataset: bronze_erp

  # Opsional, menimpa settings.yml. Source berat boleh jalan lebih awal.
  schedule: "0 1 * * *"
  task_timeout_hours: 4

# Berlaku untuk semua tabel di file ini kecuali ditimpa per tabel.
defaults:
  write_disposition: merge
  lookback_days: 3

tables:

  # --- Pola 1: incremental by datetime (paling umum) -----------------------
  - name: sales_order
    primary_key: [order_id]
    cursor: modified_at
    lookback_days: 2

  # --- Pola 2: composite primary key + buang kolom berat -------------------
  - name: sales_order_line
    primary_key: [order_id, line_no]
    cursor: modified_at
    exclude_columns: [raw_payload]        # varbinary(max), tidak dipakai di silver

  # --- Pola 3: incremental by id (tabel append-only, tanpa kolom waktu) ----
  - name: stock_movement
    primary_key: [movement_id]
    cursor: movement_id
    cursor_type: integer
    lookback: 1000                        # mundur 1000 id, bukan hari
    initial_value: 0

  # --- Pola 4: tabel master kecil, full refresh tiap hari ------------------
  #     Dipakai kalau tabel bisa ada penghapusan baris. `merge` tidak bisa
  #     mendeteksi baris yang dihapus di source; `replace` bisa.
  - name: master_product
    primary_key: [product_id]
    write_disposition: replace

  # --- Pola 5: kolom decimal presisi tinggi --------------------------------
  - name: price_list
    primary_key: [price_list_id]
    cursor: modified_at
    column_overrides:
      unit_price:
        data_type: decimal
        precision: 38
        scale: 9
