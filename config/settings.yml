# Default global untuk semua source.
#
# Urutan menimpa (yang paling bawah menang):
#   1. settings.yml            <- file ini
#   2. defaults: di file source
#   3. setelan per tabel
#
# Jadi: taruh yang berlaku umum di sini, yang khusus di file source.

defaults:
  # replace | append. `merge` sah di config tapi BELUM didukung alur
  # GCS -> BigQuery (ditolak saat validasi). Kalau ragu, replace selalu benar.
  write_disposition: replace
  cursor_type: datetime         # datetime | integer
  lookback_days: 3
  lookback: 0
  chunk_size: 50000
  reflection_level: minimal     # minimal | full | full_with_precision
  exclude_columns: []
  column_overrides: {}

pipeline:
  backend: pyarrow
  loader_file_format: parquet
  # Folder raw di dalam bucket GCS_STAGING_BUCKET. Kosong = root bucket:
  #   gs://<bucket>/<source>/<tabel>/<tanggal>/<load_id>.<n>.parquet
  # Setiap run disimpan (tidak ditimpa); umur file diatur lifecycle bucket.
  raw_prefix: ""

# Setelan Airflow. Bisa ditimpa per source di blok `source:`.
airflow:
  schedule: "0 1 * * *"     # tiap hari pukul 01:00 waktu server
  start_date: 2026-01-01
  pool: dlt_ingest          # batasi berapa task ingestion boleh jalan bersamaan
  task_timeout_hours: 4     # satu tabel lebih lama dari ini dianggap macet
  retries: 1
