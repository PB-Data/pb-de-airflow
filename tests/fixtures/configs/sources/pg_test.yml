name: pg_test
description: Source Postgres lokal untuk test end-to-end (meniru SQL Server)
type: postgres
airflow_conn_id: postgres_pg_test
source_timezone: Asia/Jakarta
schedule: "0 1 * * *"
start_date: 2026-09-01
bronze_dataset: bronze_pg_test
file_format: parquet
defaults:
  lookback_hours: 48
  initial_value: "2026-09-01T00:00:00"
tables:
  - table: dbo.Customer
    load: incremental
    cursor: ModifiedDate
    primary_key: [CustomerID]
  - table: dbo.SalesOrderHeader
    load: incremental
    cursor: ModifiedDate
    primary_key: [SalesOrderID]
  - table: dbo.SalesOrderDetail
    load: incremental
    cursor: ModifiedDate
    primary_key: [SalesOrderID, SalesOrderDetailID]
  - table: dbo.Product
    load: full
    primary_key: [ProductID]
