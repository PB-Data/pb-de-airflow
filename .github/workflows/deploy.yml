# Deploy ke VM Airflow setiap push ke main (scripts/deploy.sh yang sama dengan dari laptop).
# Setup sekali: infra/github_deploy_setup.sh di repo pb-dwh.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: SSH key
        env:
          KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/google_compute_engine
          chmod 600 ~/.ssh/google_compute_engine
          echo "$(ssh-keygen -y -f ~/.ssh/google_compute_engine) github-deploy" > ~/.ssh/google_compute_engine.pub
      # --rebuild selalu: kalau Dockerfile/compose/requirements tidak berubah, build kena cache dan
      # container tidak di-restart.
      - run: scripts/deploy.sh --rebuild
        env:
          PB_DWH_VM_USER: github-deploy
