# Airflow 3.1.6 — LocalExecutor + Postgres container
#
# Diturunkan dari docker-compose.yaml resmi Airflow 3.1.6, dengan perubahan:
#   - CeleryExecutor -> LocalExecutor  (redis, worker, flower dihapus)
#   - volume bind ke /data (disk data terpisah), bukan folder lokal
#   - mem_limit per service supaya satu task rakus tidak menjatuhkan VM
#   - DLT_DATA_DIR diarahkan ke disk data
#
# PENTING soal LocalExecutor: task jalan sebagai SUBPROCESS di dalam
# container scheduler. Jadi mem_limit scheduler = memori scheduler + semua
# task yang jalan bersamaan. Itu sebabnya angkanya 10g, bukan 2g.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: pb-dwh/airflow:3.1.6
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'

    # --- Kontrol beban. Lihat catatan mem_limit scheduler di atas. ---
    AIRFLOW__CORE__PARALLELISM: '4'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '4'
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: '1'

    # --- dlt: working dir extract/normalize di disk data, bukan boot disk ---
    DLT_DATA_DIR: /opt/dlt
    DLT_PROJECT_DIR: /opt/dlt

    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
  volumes:
    - /data/airflow/dags:/opt/airflow/dags
    - /data/airflow/logs:/opt/airflow/logs
    - /data/airflow/config:/opt/airflow/config
    - /data/airflow/plugins:/opt/airflow/plugins
    - /data/dlt:/opt/dlt
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s
    mem_limit: 1g
    restart: unless-stopped

  # Jalan sekali saat `docker compose up`, lalu exit.
  # Migrasi skema DB + buat user admin UI.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config} /opt/dlt
        /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
    user: "0:0"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 1536m
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # 10g = ~0.7g scheduler + 4 slot x ~2.3g (task dlt + supervisor-nya).
    # memswap_limit disamakan dengan mem_limit: matikan swap DI DALAM container
    # supaya task bocor memori gagal cepat, bukan thrashing ke disk yang
    # sedang dipakai dlt menulis Parquet.
    mem_limit: 10g
    memswap_limit: 10g
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Tidak ikut `up`. Dipakai manual:
  #   docker compose run --rm airflow-cli airflow db check
  airflow-cli:
    <<: *airflow-common
    profiles: ["cli"]
    command: version
    restart: "no"

volumes:
  postgres-db-volume:
