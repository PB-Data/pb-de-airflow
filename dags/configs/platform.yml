# Setelan global, dipakai semua DAG bronze & transform.
gcp:
  bq_project: smi-dwh              # project BigQuery + bucket lake (BEDA dengan project Cloud SQL)
  bq_location: asia-southeast2     # dataset BigQuery dan bucket lake WAJIB satu region

lake:
  # File lama TIDAK dihapus: tiap run menambah file di
  # gs://<bucket>/<dataset>/<tabel>/<YYYY>/<MM>/<DD>/<load_id>.<file_id>.<parquet|jsonl.gz>
  bucket_url: gs://smi-dwh-datalake  # TODO: samakan dengan LAKE_BUCKET di infra/gcp_setup.sh

runtime:
  timezone: Asia/Jakarta                # timezone jadwal cron
  dlt_python: /opt/dlt-venv/bin/python  # venv dlt di image pb-airflow (docker/Dockerfile)
