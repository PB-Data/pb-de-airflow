# =====================================================================
# Source: Cloud SQL for SQL Server  ->  bronze (GCS + BigQuery)
# DAG yang dihasilkan: bronze__sqlserver_main  (file DAG: dags/bronze__sqlserver_main.py)
#
# Nambah tabel = cukup tambah item di "tables" lalu sync ke VM. Tidak perlu ubah Python.
# Nama kolom di BigQuery otomatis snake_case oleh dlt: CustomerID -> customer_id
# =====================================================================
name: sqlserver_main                  # WAJIB sama dengan nama file
description: Cloud SQL SQL Server (project Cloud SQL terpisah) - contoh database transaksi
type: mssql                           # mssql | postgres | sqlalchemy
airflow_conn_id: mssql_sqlserver_main # Airflow Connection: host/port/login/password/schema(=database)
source_timezone: Asia/Jakarta         # kolom datetime di SQL Server = jam dinding WIB (tanpa timezone)

schedule: "0 1 * * *"                 # 01:00 WIB tiap hari (timezone dari platform.yml)
start_date: 2026-09-01
max_active_tasks: 4                   # maks tabel diekstrak paralel per run -> jaga beban DB sumber
# pool: sqlserver_main                # opsional: batas global lintas run (buat dulu: airflow pools set ...)

bronze_dataset: bronze_sqlserver_main # dataset BigQuery (dibuat otomatis oleh dlt)
file_format: parquet                  # parquet (disarankan) | jsonl (-> .jsonl.gz)
table_naming: schema__table           # schema__table -> dbo__customer | table -> customer
tags: [sqlserver]

defaults:                             # default untuk semua tabel di bawah (bisa di-override per tabel)
  lookback_hours: 48                  # incremental membaca ulang 48 jam terakhir dari last_value (jaga data telat)
  initial_value: "2024-01-01T00:00:00"  # run pertama ambil data sejak tanggal ini (lihat README: backfill)
  chunk_size: 50000
  backend: pyarrow
  timeout_minutes: 120

tables:
  # --- incremental: append ke bronze, dedup di silver -----------------
  - table: dbo.Customer
    load: incremental
    cursor: ModifiedDate
    primary_key: [CustomerID]

  - table: dbo.SalesOrderHeader
    load: incremental
    cursor: ModifiedDate
    primary_key: [SalesOrderID]
    lookback_hours: 72

  - table: dbo.SalesOrderDetail
    load: incremental
    cursor: ModifiedDate
    primary_key: [SalesOrderID, SalesOrderDetailID]
    # on_cursor_null: include        # kalau ModifiedDate bisa NULL (default: raise = gagal & kasih tahu)

  # --- full: tabel kecil / tanpa kolom updated -> replace tiap run -----
  - table: dbo.Product
    load: full
    primary_key: [ProductID]

  # --- contoh lain (nonaktif) ------------------------------------------
  - table: dbo.AuditLog
    load: incremental
    cursor: LogID                     # cursor angka (IDENTITY) untuk tabel append-only
    initial_value: 0
    lookback_units: 0
    primary_key: [LogID]
    excluded_columns: [RawPayload]    # skip kolom besar / tipe aneh (geography, dll)
    enabled: false
